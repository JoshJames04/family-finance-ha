[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-finance-backend"
version = "1.0.5"
description = "Family Finance — self-hosted household finance app backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "cryptography>=50,<51",
    "python-multipart>=0.0.20",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
    "coverage>=7.6",
    "schemathesis>=4.0",
    "jsonschema>=4.23",
]

[project.scripts]
ff-backend = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "perf: performance budget checks — non-gating, reported in CI (#132)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
