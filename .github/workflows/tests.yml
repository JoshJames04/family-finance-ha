name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend presence
        id: check
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/ found - skipping backend job"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.present == 'yes'
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        if: steps.check.outputs.present == 'yes'
        working-directory: backend
        run: pip install -e '.[dev]' || pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint & typecheck
        if: steps.check.outputs.present == 'yes'
        working-directory: backend
        run: |
          ruff check . || true   # ratchet: enforce once configured
          mypy app || mypy src || true
      - name: Unit & integration tests
        if: steps.check.outputs.present == 'yes'
        working-directory: backend
        run: pytest -x --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend presence
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/ found - skipping frontend job"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'yes'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, test, build
        if: steps.check.outputs.present == 'yes'
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  migrations:
    # Every schema change must prove upgrade AND downgrade on a scratch DB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect migrations presence
        id: check
        run: |
          if [ -f backend/alembic.ini ] || [ -f backend/migrations/env.py ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No migrations found - skipping migrations job"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.present == 'yes'
        with:
          python-version: '3.13'
      - name: Upgrade/downgrade migration test
        if: steps.check.outputs.present == 'yes'
        working-directory: backend
        env:
          FF_DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          pip install -e '.[dev]' || pip install -r requirements.txt -r requirements-dev.txt
          alembic upgrade head && alembic downgrade -1 && alembic upgrade head
