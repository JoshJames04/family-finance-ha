name: tag-on-main

# Push to main → tag v{version} on the merge commit → dispatch
# release.yml (verify → smoke → multi-arch publish → GitHub release).
# Dispatch, not the tag-push event: GITHUB_TOKEN events never cascade
# into other workflows, so the tag alone cannot fire release.yml.
# Idempotent: an existing tag exits cleanly, so repeated pushes to
# main between releases are harmless.

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag v{version} if it does not exist
        run: |
          set -euo pipefail
          v="$(python scripts/version.py get)"
          python scripts/version.py check
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then
            echo "tag v$v already exists — nothing to release"
            exit 0
          fi
          git tag "v$v" "$GITHUB_SHA"
          git push origin "v$v"
          echo "tagged v$v on $GITHUB_SHA"
          gh workflow run release.yml -f tag="v$v" --ref main
          echo "dispatched release.yml for v$v"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
