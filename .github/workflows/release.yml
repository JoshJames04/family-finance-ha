name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/joshjames04/family-finance-ha

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match __version__
        run: |
          set -euo pipefail
          v="$(python scripts/version.py get)"
          python scripts/version.py check
          [ "${{ github.ref_name }}" = "v${v}" ] || {
            echo "tag ${{ github.ref_name }} != v${v}"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
        id: v

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build single-arch image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ff:ci
          build-args: VERSION=${{ needs.verify.outputs.version }}
      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name ff -p 8099:8099 \
            -e FF_ENV=ci -e FF_DATA_DIR=/tmp ff:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8099/healthz && break || sleep 1
          done
          curl -sf http://localhost:8099/healthz
          api_v=$(curl -sf http://localhost:8099/api/v1/version \
                  | python -c "import json,sys;print(json.load(sys.stdin)['version'])")
          [ "$api_v" = "${{ needs.verify.outputs.version }}" ]
          docker inspect ff:ci --format \
            '{{index .Config.Labels "org.opencontainers.image.version"}}' \
            | grep -Fx "${{ needs.verify.outputs.version }}"

  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch build + push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ needs.verify.outputs.version }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with generated changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Family Finance ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
