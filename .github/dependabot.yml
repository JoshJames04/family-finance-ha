version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:devops, priority:p2]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:frontend, priority:p2]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [area:devops, priority:p2]
