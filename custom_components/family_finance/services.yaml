add_transaction:
  name: Add transaction
  description: >-
    Record a transaction in Family Finance. Amount is in GBP and is
    converted to pence — negative for spending, positive for income.
    The record is audited app-side.
  fields:
    account_id:
      name: Account ID
      description: Numeric account ID from the Family Finance app.
      required: true
      selector:
        number:
          min: 1
          mode: box
    date:
      name: Date
      description: Transaction date.
      required: true
      selector:
        date:
    amount:
      name: Amount
      description: Amount in GBP (negative = spend, positive = income).
      required: true
      selector:
        number:
          step: 0.01
          mode: box
    payee:
      name: Payee
      description: Who the money moved to/from.
      required: false
      selector:
        text:
    category_id:
      name: Category ID
      description: Optional category ID for budgeting attribution.
      required: false
      selector:
        number:
          min: 1
          mode: box
    notes:
      name: Notes
      required: false
      selector:
        text:

record_overtime:
  name: Record overtime
  description: >-
    Log an overtime entry against an employment. The entry is audited
    app-side and flows into the next payroll run.
  fields:
    employment_id:
      name: Employment ID
      description: Numeric employment ID from the Family Finance app.
      required: true
      selector:
        number:
          min: 1
          mode: box
    work_date:
      name: Work date
      description: Date the overtime was worked.
      required: true
      selector:
        date:
    hours:
      name: Hours
      description: Hours worked (0–24).
      required: true
      selector:
        number:
          min: 0
          max: 24
          step: 0.25
          mode: box
    multiplier_bps:
      name: Multiplier (bps)
      description: >-
        Optional pay multiplier in basis points (15000 = 1.5×).
        Defaults to the employment's configured rate.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    day_type:
      name: Day type
      required: false
      selector:
        select:
          options:
            - weekday
            - saturday
            - sunday
            - bank_holiday
    notes:
      name: Notes
      required: false
      selector:
        text:

refresh_bank_sync:
  name: Refresh bank sync
  description: >-
    Force an immediate refresh of Family Finance data — the
    integration's sync path is its API poll, so this re-runs the poll
    now rather than waiting for the next interval.
